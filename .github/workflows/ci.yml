name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: apos_user
          POSTGRES_PASSWORD: apos_pass
          POSTGRES_DB: apos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apos_user -d apos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: apos_test
      APOS_TEST_DB: '1'
      POSTGRES_USER: apos_user
      POSTGRES_PASSWORD: apos_pass
      SECRET_KEY: ci
      APP_BASE_URL: http://localhost:3001
      ALLEGRO_REDIRECT_URI: http://localhost:3001/api/v1/accounts/allegro/callback
      DATABASE_URL: postgresql://apos_user:apos_pass@localhost:5432/apos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head && python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
